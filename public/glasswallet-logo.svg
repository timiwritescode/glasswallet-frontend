<svg
  width="900"
  height="240"
  viewBox="0 0 900 240"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Glass gradient -->
    <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
    <rect
    x="60"
    y="76"
    width="120"
    height="40"
    rx="16"
    fill="rgba(255,255,255,0.18)"
  />

  <!-- Wallet body -->
  <rect
    x="60"
    y="96"
    width="120"
    height="80"
    rx="20"
    fill="url(#glassGradient)"
    stroke="url(#accentGradient)"
    stroke-width="6"
  />

  <!-- Wallet flap -->

  <!-- Contributors dots -->
  <circle cx="90" cy="128" r="6" fill="#FF8C00"/>
  <circle cx="120" cy="128" r="6" fill="#87CEEB"/>
  <circle cx="150" cy="128" r="6" fill="#8A2BE2"/>

  <!-- Timeline bars -->
  <rect x="90" y="148" width="60" height="6" rx="3" fill="#87CEEB"/>
  <rect x="90" y="160" width="42" height="6" rx="3" fill="#FF8C00"/>

  <!-- Brand name -->
  <text
    x="200"
    y="145"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="64"
    font-weight="700"
    fill="#FF8C00"
    letter-spacing="-1"
  >
    Glass
    <tspan fill="#8A2BE2">wallet</tspan>
  </text>

  <!-- Subtle underline accent -->
  <rect
    x="200"
    y="160"
    width="210"
    height="6"
    rx="3"
    fill="url(#accentGradient)"
  />
</svg>
