<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradient for glass effect -->
    <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Wallet border gradient -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square (app icon base) -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="96"
    fill="#0F172A"
  />

  <!-- Wallet body -->
  <rect
    x="120"
    y="160"
    width="272"
    height="192"
    rx="32"
    fill="url(#glassGradient)"
    stroke="url(#borderGradient)"
    stroke-width="10"
  />

  <!-- Wallet flap -->
  <rect
    x="120"
    y="140"
    width="272"
    height="64"
    rx="24"
    fill="rgba(255,255,255,0.15)"
  />

  <!-- Contribution dots (people) -->
  <circle cx="168" cy="224" r="10" fill="#FF8C00"/>
  <circle cx="208" cy="224" r="10" fill="#87CEEB"/>
  <circle cx="248" cy="224" r="10" fill="#8A2BE2"/>
  <circle cx="288" cy="224" r="10" fill="#87CEEB"/>
  <circle cx="328" cy="224" r="10" fill="#FF8C00"/>

  <!-- Fund timeline bars -->
  <rect x="168" y="264" width="176" height="10" rx="5" fill="#87CEEB"/>
  <rect x="168" y="288" width="132" height="10" rx="5" fill="#FF8C00"/>
  <rect x="168" y="312" width="96" height="10" rx="5" fill="#8A2BE2"/>

  <!-- Transparency highlight -->
  <path
    d="M140 170 L260 170 L180 320 Z"
    fill="rgba(255,255,255,0.08)"
  />
</svg>
